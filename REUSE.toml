# SPDX-License-Identifier: Apache-2.0
#
# Machine-readable licensing, per the REUSE specification. The code is
# Apache-2.0; the census data under data/ is CC-BY-4.0.

version = 1
SPDX-PackageName = "passmcp-census"
SPDX-PackageSupplier = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/passmcp-census"

[[annotations]]
path = ["go.mod", ".gitignore", ".github/CODEOWNERS", ".devcontainer/devcontainer.json", "**/testdata/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Generated by pip-compile: the manual's hash-locked build requirements,
# kept identical to passmcp's lock.
[[annotations]]
path = ["docs/requirements.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The census data: each edition's CSV, JSON and datapackage.json, and the
# exclusion list. JSON and CSV take no comments, so the licence is here.
[[annotations]]
path = ["data/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "CC-BY-4.0"
