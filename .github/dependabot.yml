version: 2
updates:
  # The module has no dependencies today; this watches for the first one.
  # The passmcp release a census runs is pinned in the Makefile and moves by
  # hand, because a new passmcp version changes what an edition measures.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docs)"
