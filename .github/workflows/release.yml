# A release of passmcp-census is a signed tag and its release page: there
# is no binary to attach, because the command is installed with
# `go install` from the module proxy, and a census edition is data in the
# repository under data/<edition>/, not a release asset. This publishes the release page
# beside the tag, in the family's layout: the hand-written highlights from
# docs/releases/vX.Y.Z.md, then GitHub's generated "What's Changed", the
# checksums section and the full-changelog link.
name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run mode: verifies the versions and composes the notes for the
  # newest CHANGELOG release, then stops short of publishing anything.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tag names a release on main, and every file that names the
      # version names this one. A dry run checks the newest CHANGELOG
      # release instead of a tag.
      - name: Resolve and verify the release
        id: ver
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            tag="v$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')"
          else
            tag="${GITHUB_REF_NAME}"
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
            test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"
          fi
          scripts/verify-release-versions.sh "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Test release source
        env:
          GOTOOLCHAIN: auto
        run: go test -count=1 ./...

      # Highlights by hand, the rest generated: GitHub's notes end with the
      # "Full Changelog" line, and the checksums section goes before it.
      - name: Compose the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          target=()
          [ "${DRY_RUN}" = "true" ] && target=(-f target_commitish="${GITHUB_SHA}")
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" "${target[@]}" --jq .body > "${RUNNER_TEMP}/generated.md"
          {
            sed '1,/^$/{/^<!--/d;/^$/d;}' "docs/releases/${TAG}.md"
            echo
            grep -v '^\*\*Full Changelog\*\*' "${RUNNER_TEMP}/generated.md"
            echo
            echo "## Checksums"
            echo
            echo "This release attaches no downloadable assets."
            echo
            grep '^\*\*Full Changelog\*\*' "${RUNNER_TEMP}/generated.md" || true
          } > notes.md
          cat notes.md

      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "${TAG}" --title "passmcp-census ${TAG#v}" --notes-file notes.md --verify-tag
